name: macOS checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whitespace and conflict markers
        if: github.event_name == 'pull_request'
        run: git diff --check HEAD^1 HEAD
      - name: Check CLI and staged installation
        shell: bash
        run: |
          bash -n stayawake
          bash tests/updates.sh
          ./stayawake --help
          ./stayawake --version
          ./stayawake buddy | grep -E 'Harrie · (on watch|off duty)'
          ./stayawake status | grep -E '^(ON|OFF) '
          prefix="$RUNNER_TEMP/stayawake installation"
          make install PREFIX="$prefix"
          "$prefix/bin/stayawake" status
          make uninstall PREFIX="$prefix"
          test ! -e "$prefix/bin/stayawake"
